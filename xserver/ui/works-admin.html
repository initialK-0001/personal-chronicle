<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>作品集の管理 | Brand-new TOKYO</title><link rel="stylesheet" href="/style.css"></head><body class="works-admin"><div class="trial"><a href="/admin">投稿管理</a><a href="/works">作品集を見る</a></div><div class="masthead"><header><a class="brand" href="/">Brand-new <strong>TOKYO</strong></a></header></div><div class="layout"><aside class="sidebar"><button id="newWork">作品を追加</button><nav id="worksList" class="browse-nav"></nav></aside><main><h1>作品集の管理</h1><p id="status" role="status"></p><form id="workForm" hidden><p id="parentName"></p><label>名前<input id="workTitle" maxlength="160" required></label><label>説明<textarea id="description" rows="10" style="width:100%"></textarea></label><h2>関連投稿</h2><input id="filterPosts" type="search" placeholder="投稿を検索" aria-label="関連投稿を検索"><div id="postChoices" style="max-height:22rem;overflow:auto"></div><p>関連投稿の公開状態は変わりません</p><div class="editorfoot"><button type="submit">下書き保存</button><button type="button" id="preview">プレビュー</button><button type="button" id="release" class="primary">公開</button><button type="button" id="unpublish">非公開にする</button></div><p><button type="button" id="addVersion">バージョンを追加</button> <a id="publicLink" hidden>公開ページ</a></p></form><section id="previewArea" class="rendered" hidden></section></main></div><script type="module" src="/works-admin.js"></script></body></html>
