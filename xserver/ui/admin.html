<!doctype html><html lang="ja"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>投稿管理 | Brand-new TOKYO</title><link rel="stylesheet" href="style.css"></head><body>
<div class="trial"><span>投稿管理 <span class="trialnote">下書きはサーバーに保存</span></span><a href="/admin/comments">コメント</a><button id="logoutButton">ログアウト</button></div>
<div class="masthead"><header><button class="brand" id="brand">Brand-new <strong>TOKYO</strong></button><form id="searchForm" role="search"><input id="search" type="search" placeholder="作品名やキーワードで検索" aria-label="投稿を検索"><button type="submit" aria-label="検索">検索</button></form><div class="account"><button id="draftButton">下書き</button><button class="primary" id="newButton">投稿する</button></div></header></div>

<div class="layout"><aside class="sidebar"><nav class="browse-nav" aria-label="表示対象"><button data-view="all" aria-pressed="true">すべて</button><button data-view="images" aria-pressed="false">画像</button><button data-view="articles" aria-pressed="false">文章</button><button id="collectionsButton">作品集</button></nav><h2>テーマ</h2><div id="themes"></div></aside><main><div class="resulthead"><h1 id="pageTitle">投稿一覧</h1></div><div class="activefilters" id="activeFilters"></div><article id="articlePage" hidden></article><section id="feed" class="feed" aria-label="投稿一覧"></section><div id="empty" hidden>該当する投稿はありません <button id="clearFilters">条件を解除</button></div></main></div>
<div id="connection" role="status"></div><footer><a href="/">閲覧ページへ</a><span>Brand-new TOKYO</span><button id="backupButton">投稿をバックアップ</button><button id="legacyButton">旧試作データを書き出す</button></footer>
<dialog id="editor"><div class="editorhead"><h2 id="editorTitle">投稿</h2><span id="saveState" role="status">下書き</span><button id="closeEditor">閉じる</button></div><div class="editortools"><button id="addImage">画像を追加</button><label>書式 <select id="format"><option value="paragraph">本文</option><option value="heading">見出し</option><option value="quote">引用</option></select></label><button id="addLink">リンク</button><button id="arrange" aria-pressed="false">画像と文章の移動</button></div><section class="paper"><input id="title" placeholder="タイトルを追加 任意" aria-label="タイトル 任意"><div id="writing" aria-label="投稿本文"></div></section><div class="editormeta"><details><summary>テーマ</summary><label>テーマ<input id="tags" placeholder="VRM 制作記録" aria-label="テーマ"></label></details><details><summary>保存について</summary><p class="hint">同じアカウントで別の端末から編集できます<br>保存済みの表示を確認してから画面を閉じてください<br>画像は1枚8MBまで 合計30MBまで</p><button id="exportButton">下書きを書き出す</button></details></div><div class="editorfoot"><span class="hint" id="uploadState">下書き保存では公開内容は変わりません</span><button id="previewButton">プレビュー</button><button class="primary" id="publishButton">一覧に追加</button></div></dialog>
<dialog id="detail"><div class="detailhead"><span id="detailLabel"></span><button id="closeDetail">閉じる</button></div><article id="detailContent"></article><div id="detailActions"></div></dialog>
<dialog id="linkDialog"><form method="dialog" id="linkForm"><h2>リンクを追加</h2><label>表示名<input id="linkName"></label><label>URL<input id="linkUrl" type="url" placeholder="https://" required></label><div><button type="button" id="cancelLink">キャンセル</button><button class="primary">追加</button></div></form></dialog>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><div id="toast" role="status" hidden></div><script type="module" src="admin.js"></script></body></html>
