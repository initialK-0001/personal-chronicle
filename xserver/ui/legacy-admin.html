<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>旧記事の編集 | Brand-new TOKYO</title><link rel="stylesheet" href="/style.css"><style>
#legacyEditor label{display:block;margin:16px 0}#legacyTitle{width:100%;box-sizing:border-box;font:inherit;padding:10px}.legacy-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#legacyBody{border:1px solid #aaa;padding:16px;min-height:300px;overflow-wrap:anywhere}#legacyBody:focus{outline:2px solid #32934b}#legacyList a{display:block;padding:16px 0;border-bottom:1px solid #ddd}#legacyList time{display:block;margin-top:6px;font-size:13px;color:#666}#legacyPreview{border-top:1px solid #aaa;margin-top:24px;padding-top:20px}#legacySearch{width:100%;padding:10px;box-sizing:border-box}#thumbnailSettings{margin:20px 0;border:1px solid #ddd;padding:14px}#thumbnailPreview{max-width:180px;max-height:140px;object-fit:contain}#thumbnailSettings button{margin:4px 8px 4px 0}#thumbnailSettings p{font-size:13px;color:#666}#legacyBody iframe{pointer-events:none;max-width:100%}
</style></head><body><div class="masthead"><header><a class="brand" href="/admin">Brand-new TOKYO 管理</a></header></div><main class="legacy-article"><h1>旧記事</h1><p id="status" role="status">読み込み中</p><section id="legacyListing"><label>記事を探す<input id="legacySearch" type="search"></label><div id="legacyList"></div></section><section id="legacyEditor" hidden><a href="/admin/legacy-edit">旧記事の一覧へ</a><label>タイトル<input id="legacyTitle"></label><fieldset id="thumbnailSettings"><legend>サムネイル</legend><img id="thumbnailPreview" alt="現在のサムネイル" hidden><p id="thumbnailHint"></p><button id="changeThumbnail">サムネイルを変更</button><button id="automaticThumbnail">本文先頭の画像を使う</button><input id="thumbnailFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><p>下書き保存では公開画像は変わりません。「公開内容を更新」で反映します。</p></fieldset><div class="legacy-tools"><button data-command="bold">太字</button><button data-command="formatBlock" data-value="h2">見出し</button><button data-command="formatBlock" data-value="p">本文</button><button data-command="formatBlock" data-value="blockquote">引用</button><button id="addLink">リンク</button><button id="addImage">画像を追加</button><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" hidden></div><div id="legacyBody" class="rendered" contenteditable="true" role="textbox" aria-label="本文" aria-multiline="true"></div><div class="legacy-tools"><button id="saveDraft">下書きを保存</button><button id="preview">プレビュー</button><button id="release">公開内容を更新</button><button id="unpublish">非公開にする</button><a id="publicLink" target="_blank" rel="noopener">公開ページ</a></div><section id="legacyPreview" class="rendered" hidden></section></section></main><script type="module" src="/legacy-admin.js"></script></body></html>
