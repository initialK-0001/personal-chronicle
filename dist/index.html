<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Brand-new TOKYO</title><link rel="stylesheet" href="style.css"></head><body>
<div class="masthead"><header><button class="brand" id="brand">Brand-new <strong>TOKYO</strong></button><form id="searchForm" role="search"><input id="search" type="search" placeholder="作品名やキーワードで検索" aria-label="投稿を検索"><button type="submit" aria-label="検索">検索</button></form></header></div>
